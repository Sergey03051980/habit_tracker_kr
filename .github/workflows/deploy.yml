name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t habit-tracker:latest .

    - name: Deploy to Server
      if: github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v0.1.5
      env:
        DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Starting deployment to Yandex Cloud..."
          
          # Go to project directory
          cd /opt/habit_tracker || mkdir -p /opt/habit_tracker && cd /opt/habit_tracker
          
          # Stop old containers
          docker-compose down 2>/dev/null || true
          
          # Update code
          git pull origin main || git clone https://github.com/Sergey03051980/habit_tracker_kr.git .
          
          # Start containers
          docker-compose up -d --build
          
          # Run migrations
          docker-compose exec web python manage.py migrate --noinput
          
          echo "✅ Deployment completed!"
          echo "🌐 Application: http://${{ secrets.SERVER_HOST }}"
